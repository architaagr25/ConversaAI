[tool.pytest.ini_options]
# Lets tests import the project packages without installing the project first.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# The call loop is async, so its tests are too.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 95
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
